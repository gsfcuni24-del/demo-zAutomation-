[project]
name = "zautomation-backend"
version = "0.1.0"
description = "zAutomation Helper AI - multi-agent PLC/HMI engineering platform (backend)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Web / API
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",
    # Validation / config
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "email-validator==2.3.0",
    # Database
    "sqlmodel==0.0.48",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "greenlet==3.2.4",
    # Auth
    "fastapi-users[sqlalchemy]==15.0.5",
    # Parsing / templating / diff / rules
    "lxml==6.1.3",
    "defusedxml==0.7.1",
    "openpyxl==3.1.5",
    "jinja2==3.1.6",
    "deepdiff==9.1.0",
    "networkx==3.7",
    # Background tasks
    "arq==0.28.0",
    # Object storage
    "aiobotocore==3.9.2",
    # AI orchestration
    "langgraph==1.2.14",
    "litellm==1.104.2",
    "instructor==1.17.0",
    "qdrant-client==1.19.1",
    # Observability
    "structlog==26.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "watchfiles==1.1.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["arq.*", "defusedxml.*", "networkx.*", "aioboto3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
