name: zautomation

x-backend-common: &backend-common
  build:
    context: ./backend
    target: dev
  env_file: .env
  environment:
    UPLOAD_DIR: /app/uploads
  volumes:
    - ./backend:/app
    - /app/.venv
    - uploads_data:/app/uploads
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    qdrant:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zautomation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zautomation}
      POSTGRES_DB: ${POSTGRES_DB:-zautomation}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage


  api:
    <<: *backend-common
    # Re-sync on start: the anonymous .venv volume otherwise keeps stale deps after a rebuild.
    # Migrations run before the server starts so the schema is always at head.
    command: sh -c "uv sync --frozen && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *backend-common
    command: sh -c "uv sync --frozen && arq app.workers.settings.WorkerSettings --watch app"

  web:
    build:
      context: ./frontend
      target: dev
    # Re-install on start: the anonymous node_modules volume otherwise keeps stale deps after a rebuild.
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    env_file: .env
    environment:
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy

volumes:
  uploads_data:
  postgres_data:
  redis_data:
  qdrant_data:
